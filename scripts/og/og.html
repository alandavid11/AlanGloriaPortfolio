<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #09090b; }
  .og {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    font-family: 'Outfit', system-ui, sans-serif; color: #fafafa;
    background:
      radial-gradient(48% 70% at 82% 8%, rgba(139, 92, 246, 0.42), transparent 70%),
      radial-gradient(38% 60% at 100% 100%, rgba(255, 122, 122, 0.22), transparent 70%),
      #09090b;
  }
  .copy { position: absolute; left: 72px; top: 150px; width: 560px; }
  .eyebrow {
    font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500;
    font-size: 17px; letter-spacing: 0.2em; color: #a78bfa; text-transform: uppercase;
  }
  h1 { margin-top: 20px; font-size: 92px; line-height: 0.95; font-weight: 700; letter-spacing: -0.045em; }
  .tag { margin-top: 22px; font-size: 31px; line-height: 1.2; color: #a1a1aa; letter-spacing: -0.02em; }
  .tag b { color: #fafafa; font-weight: 500; }
  .chips { margin-top: 34px; display: flex; gap: 12px; }
  .chip {
    font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; font-size: 17px;
    padding: 11px 18px; border-radius: 999px; color: #e4e4e7;
    background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .url {
    position: absolute; left: 72px; bottom: 56px;
    font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; font-size: 18px; color: #a78bfa;
  }
  .phone {
    position: absolute; width: 236px; aspect-ratio: 9 / 19.5; border-radius: 40px; padding: 7px;
    background: linear-gradient(150deg, #3a3a42, #121216 45%, #26262c);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1), 0 40px 80px -24px rgba(0, 0, 0, 0.9);
  }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 33px; display: block; }
  .p1 { left: 690px; top: 64px; transform: rotate(-5deg); z-index: 2; }
  .p2 { left: 900px; top: 118px; transform: rotate(5deg); z-index: 1; }
</style>
</head>
<body>
<div class="og">
  <div class="copy">
    <p class="eyebrow">iOS Engineer · Saltillo, MX · Remote</p>
    <h1>Alan Gloria</h1>
    <p class="tag">I build products people use, <b>and pay for.</b></p>
    <div class="chips">
      <span class="chip">6 apps on the App Store</span>
      <span class="chip">POS live in real stores</span>
    </div>
  </div>
  <p class="url">www.alangloria.com</p>
  <div class="phone p1"><img src="../../public/posme-iphone-inicio.webp" alt="" /></div>
  <div class="phone p2"><img src="../../public/raro-app-home.webp" alt="" /></div>
</div>
</body>
</html>
