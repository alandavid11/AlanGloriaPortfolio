<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* Share image (public/og.png). Mirrors the LinkedIn banner: neutral near-black, no color washes. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #09090b; }
  .og {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    font-family: 'Outfit', system-ui, sans-serif; color: #fafafa;
    background:
      radial-gradient(42% 60% at 12% 0%, rgba(45, 212, 191, 0.13), transparent 70%),
      radial-gradient(40% 55% at 88% 100%, rgba(56, 189, 248, 0.08), transparent 70%),
      #09090b;
  }
  .og::before {
    content: ''; position: absolute; inset: 0; opacity: 0.5;
    background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px);
    background-size: 14px 14px;
    mask-image: linear-gradient(90deg, #000, transparent 70%);
  }
  .copy { position: absolute; left: 72px; top: 118px; width: 600px; }
  .eyebrow {
    font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500;
    font-size: 16px; letter-spacing: 0.2em; color: #71717a; text-transform: uppercase;
  }
  .eyebrow b { color: #e4e4e7; font-weight: 500; }
  h1 { margin-top: 22px; font-size: 96px; line-height: 0.95; font-weight: 700; letter-spacing: -0.045em; }
  .tag { margin-top: 24px; font-size: 38px; line-height: 1.08; font-weight: 600; letter-spacing: -0.035em; color: #fafafa; }
  .tag span { color: #a1a1aa; }
  .apps { position: absolute; left: 72px; bottom: 64px; display: flex; align-items: center; gap: 16px; }
  .icons { display: flex; }
  .icons img { width: 40px; height: 40px; border-radius: 10px; margin-left: -8px; box-shadow: 0 0 0 2px #09090b; background: #0b0b0f; object-fit: cover; }
  .icons img:first-child { margin-left: 0; }
  .apps p { font-size: 19px; font-weight: 500; color: #d4d4d8; letter-spacing: -0.01em; }
  .apps p i { font-style: normal; color: #52525b; padding: 0 6px; }
  .phone {
    position: absolute; aspect-ratio: 9 / 19.5; padding: 7px;
    background: linear-gradient(150deg, #3a3a42, #121216 45%, #26262c);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1), 0 40px 80px -24px rgba(0, 0, 0, 0.9);
  }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .p1 { width: 250px; left: 800px; top: 56px; border-radius: 42px; z-index: 3; }
  .p1 img { border-radius: 35px; }
  .p2 { width: 204px; left: 664px; top: 150px; border-radius: 34px; transform: rotate(-6deg); z-index: 1; opacity: 0.92; }
  .p3 { width: 204px; left: 984px; top: 150px; border-radius: 34px; transform: rotate(6deg); z-index: 2; opacity: 0.92; }
  .p2 img, .p3 img { border-radius: 28px; }
</style>
</head>
<body>
<div class="og">
  <div class="copy">
    <p class="eyebrow">iOS Engineer · <b>Founder of WalletMe + POSMe</b></p>
    <h1>Alan Gloria</h1>
    <p class="tag">I build products people use,<br /><span>and pay for.</span></p>
  </div>
  <div class="apps">
    <div class="icons">
      <img src="../../public/posme-icon.webp" alt="" /><img src="../../public/raro-icon.webp" alt="" /><img src="../../public/word-icon.webp" alt="" /><img src="../../public/triplook-icon.webp" alt="" /><img src="../../public/remainingweeks-icon.webp" alt="" />
    </div>
    <p>6 apps on the App Store<i>·</i>alangloria.com</p>
  </div>
  <div class="phone p2"><img src="../../public/raro-app-home.webp" alt="" /></div>
  <div class="phone p3"><img src="../../public/word-01-home.webp" alt="" /></div>
  <div class="phone p1"><img src="../../public/posme-iphone-inicio.webp" alt="" /></div>
</div>
</body>
</html>
